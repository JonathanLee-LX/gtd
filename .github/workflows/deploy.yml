name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc -b

  deploy:
    # 只在 push main / 手动触发时部署。success() 写明：前面的 check 失败就不部署。
    # 不要改成 always() / failure() / cancelled()，否则 check 失败也会部署。
    if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: check
    runs-on: ubuntu-latest
    # 安装、迁移、构建、部署，再加上部署后最多 15 分钟的 placement smoke。
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # #88：migration 是 deploy 之前的独立步骤。失败则本 job 停止，后面的 build / deploy / smoke 全部跳过。
      # 不要给这一步加 continue-on-error，也不要给 Deploy Worker 加 always() / failure() / cancelled()。
      - name: Apply D1 migrations
        id: migrate
        run: pnpm exec wrangler d1 migrations apply gtd --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build
        run: pnpm exec vite build
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
      # #125：显式 region 生效后，GitHub runner（美东）打到生产应看到 remote-*，而不是 local-IAD。
      # /api/health 不碰 D1。placement 传播可能滞后，最多等 15 分钟。
      - name: Smoke cf-placement
        run: |
          set -uo pipefail
          url="https://gtd.livs.top/api/health"
          deadline=$((SECONDS + 15 * 60))
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 "$url" || echo "curl_fail")
            placement=$(awk 'BEGIN{IGNORECASE=1} /^cf-placement:/ { gsub(/\r/, "", $2); print $2; exit }' "$headers")
            echo "attempt=${attempt} http=${code} cf-placement=${placement:-<missing>}"
            if [[ "$code" == "200" && "$placement" == remote-* ]]; then
              echo "placement ok: $placement"
              rm -f "$headers" "$body"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "cf-placement did not start with remote- within 15 minutes (last http=${code} placement=${placement:-<missing>})"
              echo "--- response headers ---"
              cat "$headers" || true
              echo "--- body ---"
              cat "$body" || true
              rm -f "$headers" "$body"
              exit 1
            fi
            rm -f "$headers" "$body"
            sleep 20
          done
