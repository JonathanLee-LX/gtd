[package]
name = "gtd-desktop"
version = "0.1.0"
description = "Desktop shell for the GTD web app (loads production origin)"
authors = ["Jonathan Lee"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gtd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
